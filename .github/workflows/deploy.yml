name: Build & deploy weather dashboard

on:
  push:
    branches: [main]
  schedule:
    # GitHub's scheduled runs are best-effort and get throttled hardest at peak
    # cron minutes (:00 and :30 are the busiest globally), which is why a plain
    # */30 schedule kept getting skipped. Running every 15 min at OFF-PEAK
    # offsets keeps the dashboard reliably under ~30 min stale even when GitHub
    # drops some runs. Public repo => unlimited free Actions minutes.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch latest weather + compile
        run: node scripts/fetch-weather.mjs
      - name: Self-test the compiled data
        run: node scripts/check.mjs
      - name: Build site (data already fetched above)
        run: npm run build:nodata
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

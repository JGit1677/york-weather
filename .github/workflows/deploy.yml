name: Build & deploy weather dashboard

on:
  push:
    branches: [main]
  schedule:
    # Refresh data + redeploy every 30 minutes (UTC). METAR updates hourly,
    # TAF ~4x/day, so this keeps the dashboard current without overkill.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch latest weather + compile
        run: node scripts/fetch-weather.mjs
      - name: Self-test the compiled data
        run: node scripts/check.mjs
      - name: Build site (data already fetched above)
        run: npm run build:nodata
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
